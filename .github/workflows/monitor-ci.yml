name: Host monitor CI

on:
  push:
    paths:
      - "monitor/**"
      - ".github/workflows/monitor-ci.yml"
  pull_request:
    paths:
      - "monitor/**"
      - ".github/workflows/monitor-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Test
        working-directory: monitor
        run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: windows-amd64
            binary: espnetworkserial-monitor.exe
          - goos: linux
            goarch: amd64
            artifact: linux-amd64
            binary: espnetworkserial-monitor
          - goos: linux
            goarch: arm64
            artifact: linux-arm64
            binary: espnetworkserial-monitor
          - goos: darwin
            goarch: amd64
            artifact: macos-amd64
            binary: espnetworkserial-monitor
          - goos: darwin
            goarch: arm64
            artifact: macos-arm64
            binary: espnetworkserial-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Build
        working-directory: monitor
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ${{ matrix.binary }} .
      - uses: actions/upload-artifact@v4
        with:
          name: espnetworkserial-monitor-${{ matrix.artifact }}
          path: monitor/${{ matrix.binary }}
