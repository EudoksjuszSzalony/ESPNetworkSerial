name: Firmware CI

on:
  push:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - ".github/workflows/firmware-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "examples/**"
      - "library.properties"
      - ".github/workflows/firmware-ci.yml"

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.10 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Compile BasicMonitor
        run: |
          arduino-cli compile             --fqbn esp32:esp32:esp32             --library .             examples/BasicMonitor

      - name: Compile with installer-provisioned default auth config
        run: |
          CONFIG="$HOME/.arduino15/packages/esp32/hardware/esp32/3.3.10/cores/esp32/ESPNetworkSerialConfig.h"
          cat > "$CONFIG" <<'EOF'
          #pragma once
          // ESPNetworkSerial installer-managed configuration.
          #define ESPNS_DEFAULT_AUTH_KEY "0123456789abcdef0123456789abcdef"
          EOF
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --library . \
            --build-path /tmp/espns-default-auth-build \
            examples/BasicMonitor
          rm -f "$CONFIG"

      - name: Compile with sketch-local ESPNS_AUTH_KEY override
        run: |
          cat > examples/BasicMonitor/secrets.h <<'EOF'
          #pragma once
          #define ESPNS_WIFI_SSID "ci"
          #define ESPNS_WIFI_PASSWORD "ci"
          #define ESPNS_AUTH_KEY "abcdef0123456789abcdef0123456789"
          EOF
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --library . \
            --build-path /tmp/espns-sketch-auth-build \
            examples/BasicMonitor
          rm -f examples/BasicMonitor/secrets.h

      - name: Compile WirelessOTAAndMonitor
        run: |
          arduino-cli compile             --fqbn esp32:esp32:esp32             --library .             examples/WirelessOTAAndMonitor

      - name: Compile CustomInstance
        run: |
          arduino-cli compile             --fqbn esp32:esp32:esp32             --library .             examples/CustomInstance

      - name: Compile StressEcho
        run: |
          arduino-cli compile             --fqbn esp32:esp32:esp32             --library .             examples/StressEcho

